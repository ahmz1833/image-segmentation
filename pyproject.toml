[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "malware-image-segmentation"
version = "1.1.0"
description = "Reproducible CLI for malware classification based on image segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kaggle>=1.6,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pillow>=10,<13",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13,<1",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1"]

[project.scripts]
malware-seg = "malware_segmentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
